name: Compiler l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Compiler
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk XeroxPclPrint.apk

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: XeroxPclPrint
          path: XeroxPclPrint.apk

      - name: Publier l'APK dans une Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" XeroxPclPrint.apk \
            --title "Xerox PCL Print - build ${{ github.run_number }}" \
            --notes "APK compilé automatiquement."
